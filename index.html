<!DOCTYPE html>
<html>
<head>
  <title>Travel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="travelhead">
    <h1>Travel Agency</h1>
    <p>Explore the world with us</p>
  </div>
  <div class="traveList">
    <div class="travelitem">
      <img src="paris.jpg" alt="paris">
      <h3>Paris</h3>
      <p>$899</p>
      <button>Book Now</button>
    </div>
    <div class="travelitem">
      <h3>Tokyo</h3>
      <p>$1,299</p>
      <button>Book Now</button>
    </div>
    <div class="travelitem">
      <h3>New York</h3>
      <p>$799</p>
      <button>Book Now</button>
    </div>
  </div>
  <div class="traveLine">Book now</div>
</body>
</html>
